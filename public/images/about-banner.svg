<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="asky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#ecfdf5;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="afield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#asky)"/>
  <!-- Rolling hills -->
  <ellipse cx="300" cy="280" rx="400" ry="70" fill="#86efac" opacity="0.4"/>
  <ellipse cx="900" cy="270" rx="500" ry="80" fill="#bbf7d0" opacity="0.35"/>
  <ellipse cx="1400" cy="285" rx="350" ry="65" fill="#86efac" opacity="0.3"/>
  <!-- Main field -->
  <path d="M0,320 Q250,290 500,315 Q750,340 1000,305 Q1250,270 1500,310 L1600,300 L1600,600 L0,600Z" fill="url(#afield)" opacity="0.85"/>
  <path d="M0,400 Q400,380 800,395 Q1200,410 1600,385 L1600,600 L0,600Z" fill="#166534" opacity="0.6"/>
  <!-- Factory / building silhouette -->
  <g fill="#14532d" opacity="0.3">
    <rect x="650" y="230" width="100" height="90" rx="4"/>
    <rect x="760" y="250" width="80" height="70" rx="4"/>
    <rect x="850" y="240" width="60" height="80" rx="4"/>
    <rect x="680" y="210" width="15" height="20"/>
    <rect x="870" y="215" width="12" height="25"/>
  </g>
  <!-- Warm sunlight -->
  <circle cx="250" cy="100" r="70" fill="#fbbf24" opacity="0.15"/>
  <circle cx="250" cy="100" r="40" fill="#fbbf24" opacity="0.25"/>
</svg>
