<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="csky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="cfield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#052e16"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#csky)"/>
  <!-- Certificate/shield shapes -->
  <g opacity="0.08" fill="#16a34a">
    <path d="M300,80 L340,120 L340,180 L300,200 L260,180 L260,120Z" transform="scale(1.5) translate(20,20)"/>
    <path d="M700,60 L740,100 L740,160 L700,180 L660,160 L660,100Z" transform="scale(1.3) translate(100,30)"/>
    <path d="M1100,70 L1140,110 L1140,170 L1100,190 L1060,170 L1060,110Z" transform="scale(1.4) translate(-200,20)"/>
  </g>
  <!-- Organic field -->
  <path d="M0,330 Q300,300 600,325 Q900,350 1200,310 Q1400,290 1600,320 L1600,600 L0,600Z" fill="url(#cfield)" opacity="0.85"/>
  <path d="M0,410 Q400,390 800,405 Q1200,420 1600,395 L1600,600 L0,600Z" fill="#14532d" opacity="0.6"/>
  <!-- Star / quality marks -->
  <g fill="#fbbf24" opacity="0.15">
    <polygon points="400,150 410,175 435,175 415,190 422,215 400,200 378,215 385,190 365,175 390,175"/>
    <polygon points="800,120 810,145 835,145 815,160 822,185 800,170 778,185 785,160 765,145 790,145"/>
    <polygon points="1200,140 1210,165 1235,165 1215,180 1222,205 1200,190 1178,205 1185,180 1165,165 1190,165"/>
  </g>
  <!-- Checkmarks / ticks -->
  <g stroke="#22c55e" stroke-width="3" fill="none" opacity="0.15">
    <path d="M250,250 L265,265 L290,240"/>
    <path d="M650,230 L665,245 L690,220"/>
    <path d="M1050,245 L1065,260 L1090,235"/>
    <path d="M1350,235 L1365,250 L1390,225"/>
  </g>
</svg>
