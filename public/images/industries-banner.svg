<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="isky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="ifield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#14532d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#isky)"/>
  <!-- Plantation rows  -->
  <g fill="#16a34a" opacity="0.3">
    <rect x="0" y="300" width="1600" height="4" rx="2"/>
    <rect x="0" y="330" width="1600" height="4" rx="2"/>
    <rect x="0" y="360" width="1600" height="4" rx="2"/>
    <rect x="0" y="390" width="1600" height="4" rx="2"/>
    <rect x="0" y="420" width="1600" height="4" rx="2"/>
  </g>
  <!-- Diverse crop icons abstraction -->
  <g opacity="0.2">
    <circle cx="200" cy="250" r="40" fill="#4ade80"/>
    <circle cx="400" cy="220" r="35" fill="#86efac"/>
    <circle cx="600" cy="260" r="45" fill="#22c55e"/>
    <circle cx="800" cy="230" r="38" fill="#bbf7d0"/>
    <circle cx="1000" cy="250" r="42" fill="#4ade80"/>
    <circle cx="1200" cy="220" r="36" fill="#86efac"/>
    <circle cx="1400" cy="255" r="40" fill="#22c55e"/>
  </g>
  <!-- Rich green field -->
  <path d="M0,350 Q200,320 400,345 Q600,370 800,335 Q1000,300 1200,340 Q1400,370 1600,330 L1600,600 L0,600Z" fill="url(#ifield)" opacity="0.8"/>
  <path d="M0,420 Q400,400 800,415 Q1200,430 1600,405 L1600,600 L0,600Z" fill="#052e16" opacity="0.5"/>
</svg>
